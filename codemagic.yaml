# Build do Meu Financiamento pra iPhone no Codemagic (Mac na nuvem).
# Assinatura: o próprio build cria/baixa o certificado de distribuição e o perfil App Store
# pela chave de API (integração abaixo). A chave privada do certificado fica no grupo de
# variáveis "apple_signing" do Codemagic (CERTIFICATE_PRIVATE_KEY) — mesma pros 3 apps.
# Cada build sobe pro TestFlight (teste interno).
workflows:
  ios-release:
    name: Meu Financiamento - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Vandesp App Store Connect
    environment:
      groups:
        - apple_signing
      vars:
        BUNDLE_ID: "br.com.vandesp.cliente"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Apple ID numérico do app (App Store Connect → Informações do app). Preencher
        # depois de criar o app lá.
        APP_STORE_APPLE_ID: "6828523357"
      node: 24
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Copiar o site pro projeto iOS
        script: npx cap sync ios
      - name: Certificado e perfil de distribuição (cria se não existir)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Número do build (sempre 1 acima do último no TestFlight)
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $(($ULTIMO + 1))
      - name: Gerar o .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Só sobe pro TestFlight (teste INTERNO, sem revisão). Teste externo exige preencher
        # Informações de teste no App Store Connect — ligar depois, se precisar.
        submit_to_testflight: false
