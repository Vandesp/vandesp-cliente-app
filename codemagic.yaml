# Build do Meu Financiamento pra iPhone no Codemagic (Mac na nuvem).
# A assinatura é automática pela integração com o App Store Connect (chave de API
# cadastrada no Codemagic com o nome abaixo). Cada build vai direto pro TestFlight.
workflows:
  ios-release:
    name: Meu Financiamento - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Vandesp App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.vandesp.cliente
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Apple ID numérico do app (App Store Connect → Informações do app). Preencher
        # depois de criar o app lá.
        APP_STORE_APPLE_ID: "PREENCHER"
      node: 24
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Copiar o site pro projeto iOS
        script: npx cap sync ios
      - name: Aplicar perfis de assinatura
        script: xcode-project use-profiles
      - name: Número do build (sempre 1 acima do último no TestFlight)
        script: |
          ULTIMO=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $(($ULTIMO + 1))
      - name: Gerar o .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
